version: '3.8'

services:
  deadsmile:
    build: .
    container_name: deadsmile-labs
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - deadsmile-data:/app/data
      - deadsmile-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  deadsmile-data:
  deadsmile-uploads: