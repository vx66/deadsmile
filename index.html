<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD SMILE</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">

  <div class="logo-container">
    <img src="img/logo.png" alt="Dead Smile Labs Logo" class="site-logo">
  </div>

  <div class="terminal-bar">
    <span>{{ typedCommand }}<span class="blink">█</span></span>
  </div>

  <div class="content" id="app">
    <div v-if="loading" class="loading">Loading...</div>
    <div v-else-if="articles.length === 0" class="empty">No articles found.</div>

    <article v-for="article in articles" :key="article.id" class="post">
      <div class="post-header">
        <span class="post-tag">[ {{ article.category_name || 'UNCATEGORIZED' }} ]</span>
        <span class="post-date">{{ article.date || article.created_at }}</span>
      </div>
      <h2 class="post-title" @click="togglePost(article.id)">█ {{ article.title }}</h2>
      <p class="post-subtitle">{{ article.subtitle }}</p>
      <div class="post-expandable" :id="'post-' + article.id">
        <p class="post-excerpt">{{ article.excerpt }}</p>
        <a :href="'/article/' + article.id" class="read-more">Read more →</a>
      </div>
    </article>
  </div>

  <div class="bottom-bar">
    <span>Dead Smile Labs © 2026</span>
    <a href="/about" class="who-link">Who is Xergno</a>
  </div>

</div>

<script src="/js/vue.global.prod.js"></script>
<script>
const { createApp, ref, onMounted, onUnmounted } = Vue;

const COMMANDS = [
  'deadsmile@hack ~$ cat /var/log/research.txt',
  'deadsmile@hack ~$ cat /var/log/blog.txt',
  'deadsmile@hack ~$ cat /var/log/hacking.txt',
  'deadsmile@hack ~$ cat /var/log/reverse.txt'
];

createApp({
  setup() {
    const articles = ref([]);
    const loading = ref(true);
    const typedCommand = ref('');

    let cmdIndex = 0;
    let charIndex = 0;
    let deleting = false;
    let timer = null;

    const typeLoop = () => {
      const current = COMMANDS[cmdIndex];
      if (!deleting) {
        charIndex++;
        typedCommand.value = current.substring(0, charIndex);
        if (charIndex === current.length) {
          deleting = true;
          timer = setTimeout(typeLoop, 2000);
        } else {
          timer = setTimeout(typeLoop, 50);
        }
      } else {
        charIndex--;
        typedCommand.value = current.substring(0, charIndex);
        if (charIndex === 0) {
          deleting = false;
          cmdIndex = (cmdIndex + 1) % COMMANDS.length;
          timer = setTimeout(typeLoop, 400);
        } else {
          timer = setTimeout(typeLoop, 20);
        }
      }
    };

    const togglePost = (id) => {
      const el = document.getElementById('post-' + id);
      if (el.classList.contains('expanded')) {
        el.classList.remove('expanded');
        el.style.maxHeight = '0';
        el.style.opacity = '0';
      } else {
        el.classList.add('expanded');
        el.style.maxHeight = el.scrollHeight + 'px';
        el.style.opacity = '1';
      }
    };

    const fetchArticles = async () => {
      try {
        const res = await fetch('/api/articles/public');
        articles.value = await res.json();
      } catch (e) {
        articles.value = [];
      }
      loading.value = false;
    };

    onMounted(() => {
      fetchArticles();
      typeLoop();
    });

    onUnmounted(() => {
      if (timer) clearTimeout(timer);
    });

    return { articles, loading, togglePost, typedCommand };
  }
}).mount('#app');
</script>

</body>
</html>
