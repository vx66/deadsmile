<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Smile Labs</title>
  <link rel="stylesheet" href="style.css">
  <script src="/js/marked.min.js"></script>
</head>
<body>

<div class="screen">

  <div class="logo-container">
    <img src="img/logo.png" alt="Dead Smile Labs Logo" class="site-logo">
  </div>

  <div class="terminal-bar">
    <span>deadsmile@labs ~$ cat /var/log/projects.txt</span>
    <span class="blink">█</span>
  </div>

  <div class="content" id="app">
    <div v-if="loading" class="loading">Loading...</div>
    <div v-else-if="articles.length === 0" class="empty">No articles found.</div>

    <article v-for="article in articles" :key="article.id" class="post">
      <div class="post-header">
        <span class="post-tag">[ {{ article.category_name || 'UNCATEGORIZED' }} ]</span>
        <span class="post-date">{{ article.date || article.created_at }}</span>
      </div>
      <h2 class="post-title" @click="togglePost($event, article.id)">█ {{ article.title }}</h2>
      <p class="post-subtitle">{{ article.subtitle }}</p>
      <div class="post-expandable" :id="'post-' + article.id">
        <div class="post-body-text" v-html="renderMarkdown(article.content)"></div>
        <div v-if="article.image" class="post-image">
          <img :src="'/uploads/' + article.image" :alt="article.title">
        </div>
      </div>
    </article>
  </div>

  <div class="bottom-bar">
    <span>Dead Smile Labs © 2026</span>
    <span>terminal.denpa.labs</span>
  </div>

</div>

<script src="/js/vue.global.prod.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const articles = ref([]);
    const loading = ref(true);

    const fetchArticles = async () => {
      try {
        const res = await fetch('/api/articles/public');
        articles.value = await res.json();
      } catch (e) {
        articles.value = [];
      }
      loading.value = false;
    };

    const togglePost = (event, id) => {
      const el = document.getElementById('post-' + id);
      if (el.classList.contains('expanded')) {
        el.classList.remove('expanded');
        el.style.maxHeight = '0';
        el.style.opacity = '0';
      } else {
        el.classList.add('expanded');
        el.style.maxHeight = el.scrollHeight + 'px';
        el.style.opacity = '1';
      }
    };

    const renderMarkdown = (content) => {
      if (!content) return '';
      return marked.parse(content);
    };

    onMounted(() => {
      fetchArticles();
    });

    return { articles, loading, togglePost, renderMarkdown };
  }
}).mount('#app');
</script>

</body>
</html>
