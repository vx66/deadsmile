<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who is Xergno</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/js/marked.min.js"></script>
</head>
<body>

<div class="screen">

  <div id="app">

    <nav class="menu-bar">
      <a href="/" class="menu-link">[ HOME ]</a>
      <a v-for="cat in menuCategories" :key="cat.id" :href="'/category/' + cat.slug" class="menu-link">[ {{ cat.name }} ]</a>
      <a href="/about" class="menu-link active">[ ABOUT ]</a>
    </nav>

    <div class="terminal-bar">
      <span>deadsmile@hack ~$ cat /var/log/xergno.txt</span>
      <span class="blink">█</span>
    </div>

    <div class="content">
      <div v-if="loading" class="loading">Loading...</div>
      <div v-else-if="error" class="empty">{{ error }}</div>
      <div v-else-if="content">
        <article class="post-full">
          <h1 class="post-title-full">█ Who is Xergno</h1>
          <div class="post-content-full" v-html="renderMarkdown(content)"></div>
        </article>
        <div class="post-nav">
          <a href="/" class="nav-button">Volver al home</a>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <span>Dead Smile Labs © 2026</span>
  </div>

</div>

<script src="/js/vue.global.prod.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const content = ref('');
    const loading = ref(true);
    const error = ref('');
    const menuCategories = ref([]);

    const fetchMenu = async () => {
      try {
        const res = await fetch('/api/categories/public');
        menuCategories.value = await res.json();
      } catch (e) {
        menuCategories.value = [];
      }
    };

    const renderMarkdown = (markdown) => {
      if (!markdown) return '';
      return marked.parse(markdown);
    };

    const fetchAbout = async () => {
      try {
        const res = await fetch('/api/about');
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        content.value = data.content || '';
      } catch (e) {
        error.value = 'Page not found';
      }
      loading.value = false;
    };

    onMounted(() => {
      fetchAbout();
      fetchMenu();
    });

    return { content, loading, error, renderMarkdown, menuCategories };
  }
}).mount('#app');
</script>

</body>
</html>
